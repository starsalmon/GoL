# PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:um_pros3]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_pros3
framework = arduino
; Freenove-only sources (IMU, fluid, OTA) must not be compiled into the desk toy.
build_src_filter = +<*> -<imu.cpp> -<fluid_sim.cpp> -<wifi_ota.cpp>


; Set upload_port in platformio_private.ini if needed — avoid hardcoding (ports change)


lib_deps =
    adafruit/Adafruit SSD1351 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit NeoPixel

; Freenove FNK0104B (label "FNK0104 - B - A1B0"):
; 2.8" 240x320 ILI9341 IPS + FT6336 touch, ESP32-S3R8 (8MB OPI PSRAM, 16MB QSPI flash).
; FNK0104A is the same panel without touch; FNK0104N/S are different sizes/controllers.
[env:freenove_fnk0104]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_FNK0104
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
lib_deps =
    bodmer/TFT_eSPI
    adafruit/Adafruit NeoPixel

; OTA upload for the Freenove board. Credentials and the password come
; from include/secrets.h via extra_ota.py — do not put them here.
[env:freenove_fnk0104_ota]
extends = env:freenove_fnk0104
upload_protocol = espota
upload_port = gol-freenove.local
extra_scripts = pre:extra_ota.py
